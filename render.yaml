databases:
  - name: mvp-postgres
    plan: free

services:
  - type: web
    name: mvp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mvp-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: REMINDER_WORKER_ENABLED
        value: "true"
      - key: INTERNAL_DISPATCH_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_APPROVER_CHAT_ID
        sync: false
      - key: EZR_STAGING_URL
        sync: false
      - key: EZR_PHONE_NUMBER_ID
        sync: false
      - key: EZR_WABA_ID
        sync: false
      - key: EZR_TEST_PHONE
        sync: false
      - key: EZR_DEPLOY_FE_TARGET
        value: cloudflare
      - key: EZR_DEPLOY_BE_TARGET
        value: render
      - key: EZR_ORCHESTRATOR_WORKER_POLL_MS
        value: "15000"

  - type: worker
    name: mvp-orchestrator-worker
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run worker:orchestrator
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mvp-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_APPROVER_CHAT_ID
        sync: false
      - key: EZR_STAGING_URL
        sync: false
      - key: EZR_PHONE_NUMBER_ID
        sync: false
      - key: EZR_WABA_ID
        sync: false
      - key: EZR_TEST_PHONE
        sync: false
      - key: EZR_DEPLOY_FE_TARGET
        value: cloudflare
      - key: EZR_DEPLOY_BE_TARGET
        value: render
      - key: EZR_ORCHESTRATOR_WORKER_POLL_MS
        value: "15000"
